<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket-System · 演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Ticket-System（高并发票务系统）演示
   调色：美团黄大面积填充 + 米黄奶白底 + 暖黑字
   ============================================================ */

:root{
  --brand:#FFC300;
  --brand-press:#F5A623;
  --brand-wash:#FFF3D6;
  --cream:#FFF9ED;
  --milk:#FFFFFF;
  --line:#F0E4C8;
  --line-soft:#F5EDDA;
  --ink:#2B2B2B;
  --ink-soft:#6B6455;
  --ink-faint:#A39B8B;
  --on-brand:#5C3D00;
  --ok:#3E7D5A;
  --shadow-card:0 6px 24px rgba(0,0,0,.06);

  --r-xs:6px;
  --r-sm:9px;
  --r-md:14px;
  --r-lg:20px;

  --shell:min(1180px, calc(100vw - 48px));
  --nav-h:60px;

  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box;margin:0;padding:0}

html{-webkit-text-size-adjust:100%}

body{
  font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  background:var(--cream);
  color:var(--ink);
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

/* 数字统一等宽，价格与倒计时不错位 */
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------------- 导航 ---------------- */

.nav{
  position:sticky;top:0;z-index:60;
  height:var(--nav-h);
  background:var(--cream);
  display:flex;align-items:center;
  border-bottom:1px solid var(--line);
}
.nav-in{
  width:var(--shell);margin:0 auto;
  display:flex;align-items:center;gap:36px;
}

.logo{
  display:flex;align-items:center;gap:9px;
  font-family:'Noto Serif SC',serif;font-weight:900;font-size:19px;letter-spacing:-.02em;
  color:var(--ink);text-decoration:none;
  white-space:nowrap;flex:none;
}
.logo-mark{
  width:13px;height:13px;border-radius:3px;
  background:var(--brand);
  box-shadow:0 0 0 4px rgba(255,195,0,.25);
}

.tabs{display:flex;gap:4px;height:100%;margin-left:8px}
.tab{
  position:relative;
  display:flex;align-items:center;
  padding:0 16px;height:100%;
  color:rgba(43,43,43,.62);
  font-weight:600;font-size:14.5px;
  text-decoration:none;cursor:pointer;
  white-space:nowrap;
  transition:color .18s var(--ease);
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
/* 选中指示条：滑动而非闪现 */
.tab::after{
  content:'';position:absolute;left:12px;right:12px;bottom:0;
  height:3px;border-radius:3px 3px 0 0;
  background:var(--brand);
  transform:scaleX(0);transform-origin:50% 100%;
  transition:transform .24s var(--ease);
}
.tab.on::after{transform:scaleX(1)}

.nav-right{margin-left:auto;position:relative}

/* 未登录：登录按钮 */
.btn-ghost{
  height:34px;padding:0 20px;border:none;
  border-radius:999px;background:var(--brand);
  font:inherit;font-weight:700;font-size:13.5px;
  color:var(--on-brand);cursor:pointer;
  transition:background .16s var(--ease),color .16s;
}
.btn-ghost:hover{background:var(--brand-press);color:#fff}

/* 已登录：手机号 + 悬停下拉 */
.user-btn{
  display:flex;align-items:center;gap:8px;
  height:34px;padding:0 8px 0 14px;border:1px solid var(--line);
  background:var(--milk);border-radius:999px;
  font:inherit;font-weight:700;font-size:13.5px;color:var(--ink);
  cursor:pointer;transition:background .16s var(--ease);
}
.user-btn:hover{background:var(--milk)}
.user-btn .caret{
  width:16px;height:16px;display:grid;place-items:center;
  transition:transform .2s var(--ease);
}
.account:hover .user-btn .caret{transform:rotate(180deg)}
.user-btn .caret svg{width:11px;height:11px;display:block}

.menu{
  position:absolute;right:0;top:calc(100% + 10px);
  min-width:168px;padding:6px;
  background:var(--milk);border-radius:var(--r-md);
  box-shadow:0 12px 32px rgba(43,43,43,.14);
  opacity:0;visibility:hidden;transform:translateY(-6px);
  transition:opacity .18s var(--ease),transform .18s var(--ease),visibility .18s;
}
.account:hover .menu,
.account:focus-within .menu{opacity:1;visibility:visible;transform:translateY(0)}
.menu button{
  display:block;width:100%;text-align:left;
  padding:9px 12px;border:none;background:transparent;
  border-radius:var(--r-sm);
  font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);
  cursor:pointer;transition:background .14s;
}
.menu button:hover{background:var(--cream)}

/* 小屏导航：压缩间距，允许 tabs 横向滚动 */
@media(max-width:640px){
  .nav-in{gap:8px}
  /* min-width:0 让 tabs 能收缩并横向滚动，否则撑破视口 */
  .tabs{margin-left:0;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:0 9px;font-size:13px}
  .logo{font-size:16px;gap:7px}
  .logo span{display:none}          /* 窄屏只留英文名 */
  .btn-ghost{height:30px;padding:0 13px;font-size:12.5px}
  .user-btn{height:30px;padding:0 4px 0 10px;font-size:12.5px}
  /* 工具栏窄屏：搜索框独占一行，其余换行排列 */
  .search{flex:1 1 100%;max-width:none}
  .seg{width:100%;justify-content:space-between}
  .seg button{flex:1;padding:6px 8px}
}

/* ---------------- 布局 ---------------- */

.wrap{width:var(--shell);margin:0 auto}
.page{padding:36px 0 88px;animation:page-in .28s var(--ease)}
@keyframes page-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 返回 */
.back{
  display:inline-flex;align-items:center;gap:6px;
  border:none;background:transparent;padding:0;
  font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-soft);
  cursor:pointer;margin-bottom:18px;transition:color .15s;
}
.back:hover{color:var(--ink)}
.back svg{width:13px;height:13px}

/* 页头 */
.hd{margin-bottom:24px}
.hd h1{font-family:'Noto Serif SC',serif;font-size:27px;font-weight:900;line-height:1.25}
.hd p{color:var(--ink-soft);margin-top:6px;font-size:14px}

/* 区块标题 */
.sec-hd{
  display:flex;align-items:baseline;gap:10px;
  margin:0 0 14px;
}
.sec-hd h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
.sec-hd span{font-size:12.5px;color:var(--ink-faint);font-weight:500}

/* ---------------- 搜索 ---------------- */

.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}

.search{
  position:relative;flex:1;max-width:400px;
}
.search svg{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;color:var(--ink-faint);pointer-events:none;
}
.search input{
  width:100%;height:42px;
  padding:0 14px 0 37px;
  border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:var(--milk);
  font:inherit;font-size:14px;color:var(--ink);
  transition:border-color .16s,box-shadow .16s;
}
.search input::placeholder{color:var(--ink-faint)}
.search input:focus{
  outline:none;border-color:var(--brand-press);
  box-shadow:0 0 0 3px rgba(232,180,0,.16);
}

/* 分段筛选（订单状态） */
.seg{
  display:inline-flex;padding:3px;gap:2px;
  background:var(--milk);border:1.5px solid var(--line);
  border-radius:999px;
}
.seg button{
  border:none;background:transparent;
  padding:6px 16px;border-radius:999px;
  font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);
  cursor:pointer;transition:background .16s,color .16s;
}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--brand);color:var(--on-brand)}

/* ---------------- 活动卡片网格 ---------------- */

.grid5{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
}
@media(max-width:1080px){.grid5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.grid5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.grid5{grid-template-columns:1fr}}

/* 活动卡：名称 / 地址 / 票价 自上而下 */
.stub{
  position:relative;
  display:flex;flex-direction:column;
  padding:16px;
  background:var(--milk);
  border-radius:var(--r-md);
  cursor:pointer;
  text-align:left;
  border:none;font:inherit;color:inherit;
  box-shadow:var(--shadow-card);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease);
}
.stub:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.1)}
.stub:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.stub-name{
  font-size:14.5px;font-weight:700;letter-spacing:-.01em;
  line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.stub-addr{
  margin-top:6px;font-size:11.5px;color:var(--ink-faint);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.stub-price{
  margin-top:14px;
  font-family:'Noto Serif SC',serif;font-size:22px;font-weight:900;
  line-height:1.1;color:var(--brand-press);white-space:nowrap;
}
.stub-price i{font-size:12px;font-weight:700;font-style:normal;vertical-align:8px;margin-right:1px;opacity:.7}

/* 空态 */
.empty{
  padding:64px 0;text-align:center;
  border:1.5px dashed var(--line);border-radius:var(--r-lg);
  background:var(--milk);
}
.empty p{color:var(--ink-soft);font-size:14px}

/* ---------------- 详情页 ---------------- */


.panel{
  background:var(--milk);
  border-radius:var(--r-lg);
  padding:24px;
  box-shadow:var(--shadow-card);
}

.meta-row{
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  margin-bottom:6px;
}
.price{
  font-family:'Noto Serif SC',serif;
  font-size:38px;font-weight:900;line-height:1;
  color:var(--brand-press);
}
.price .cur{font-size:20px;font-weight:700;margin-right:2px;vertical-align:2px}

.addr{
  margin-top:18px;padding-top:18px;
  border-top:1px solid var(--line-soft);
  color:var(--ink-soft);font-size:13.5px;
  display:flex;gap:9px;align-items:flex-start;
}
.addr svg{width:15px;height:15px;flex:none;margin-top:3px;color:var(--ink-faint)}

/* 卡内购买行 */
.buy-row{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  margin-top:22px;padding-top:20px;
  border-top:1px solid var(--line-soft);
}
.buy-row .label{font-size:12px;font-weight:600;color:var(--ink-faint)}
.buy-row .big{
  font-family:'Noto Serif SC',serif;font-size:30px;font-weight:900;
  margin-top:2px;color:var(--brand-press);
}
.buy-row .note{font-size:13px;color:var(--ink-soft)}

/* 选座摘要 */
.picked{
  position:relative;
  display:flex;align-items:center;
  padding:11px 30px 11px 14px;
  background:var(--brand-wash);border-radius:var(--r-sm);
  font-size:13.5px;font-weight:700;color:var(--on-brand);
}
.picked .unset{
  position:absolute;top:-8px;right:-8px;
  width:20px;height:20px;border:none;border-radius:50%;
  background:var(--ink);color:var(--cream);
  font-size:14px;line-height:1;cursor:pointer;
  display:grid;place-items:center;padding:0;
  transition:background .15s;
}
.picked .unset:hover{background:var(--danger)}

/* ---------------- 座位图（视觉主角） ---------------- */

.hall{
  background:var(--milk);
  border-radius:var(--r-lg);
  padding:32px 28px 28px;
  box-shadow:var(--shadow-card);
}
.hall-body{overflow-x:auto;padding-bottom:4px;margin-top:24px}
.seats{display:grid;gap:10px;justify-content:center;min-width:min-content;margin:0 auto}
.seat-row{display:flex;gap:10px;align-items:center;justify-content:center}

.seat{
  width:34px;height:34px;flex:none;
  border:1px solid transparent;
  border-radius:7px;
  background:#F7E8BE;
  font:inherit;font-size:11.5px;font-weight:600;
  color:var(--ink-soft);
  cursor:pointer;padding:0;
  display:grid;place-items:center;
  transition:transform .16s var(--ease),background .16s,border-color .16s,box-shadow .16s;
  /* 落座编排：按行错峰 */
  opacity:0;animation:seat-drop .3s var(--ease) forwards;
  animation-delay:calc(var(--r,0) * 45ms);
}
@keyframes seat-drop{
  from{opacity:0;transform:translateY(-7px) scale(.9)}
  to{opacity:1;transform:none}
}
.seat.free:hover{
  background:var(--brand);
  color:var(--on-brand);
  transform:translateY(-2px);
}
.seat.on{
  background:var(--brand);color:var(--on-brand);
  font-weight:800;
  transform:translateY(-2px) scale(1.08);
  box-shadow:0 4px 10px rgba(245,166,35,.45);
  z-index:1;
}
.seat.taken{
  background:#EDE7D8;
  color:var(--ink-faint);cursor:not-allowed;
}
.seat:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.aisle{width:22px;flex:none}
.rowno{
  width:24px;flex:none;text-align:right;
  font-size:12px;font-weight:600;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}

.legend{
  display:flex;gap:18px;justify-content:center;
  margin-top:24px;padding-top:18px;
  border-top:1px solid var(--line-soft);
  font-size:12px;color:var(--ink-soft);
}
.legend i{
  display:inline-block;width:14px;height:14px;
  border-radius:var(--r-xs);margin-right:6px;
  vertical-align:-2px;
}
.legend .k-free{background:#F7E8BE}
.legend .k-on{background:var(--brand)}
.legend .k-taken{background:#EDE7D8}

/* ---------------- 按钮 ---------------- */

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:46px;padding:0 22px;
  border:1.5px solid transparent;border-radius:var(--r-sm);
  font:inherit;font-size:15px;font-weight:700;
  cursor:pointer;text-decoration:none;
  transition:background .16s var(--ease),transform .12s var(--ease),border-color .16s;
}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.btn-primary{background:var(--brand);color:var(--on-brand);border-radius:999px}
.btn-primary:hover{background:var(--brand-press);color:#fff}
.btn-primary:disabled{
  background:var(--line);color:var(--ink-faint);cursor:not-allowed;transform:none;
}
.btn-block{width:100%}
.btn-line{
  background:var(--milk);border-color:var(--line);color:var(--ink-soft);
  height:40px;font-size:14px;border-radius:999px;
}
.btn-line:hover{border-color:var(--ink-faint);color:var(--ink)}

/* ---------------- 登录 ---------------- */

/* 登录页：整屏居中，隐藏导航 */
body.route-login .nav{display:none}
body.route-login .page{
  min-height:100vh;min-height:100dvh;
  display:grid;place-items:center;
  padding:24px 0;
}
body.route-login .auth{margin:0;width:100%}

.auth{
  max-width:400px;margin:52px auto;
  background:var(--milk);border-radius:var(--r-lg);padding:32px 30px;
  box-shadow:var(--shadow-card);
}
.auth h1{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:900;text-align:center}
.guest-link{
  display:block;width:100%;margin-top:16px;
  padding:8px;border:none;background:transparent;
  font:inherit;font-size:13.5px;font-weight:600;
  color:var(--ink-soft);cursor:pointer;border-radius:var(--r-sm);
  transition:color .16s var(--ease),background .16s var(--ease);
}
.guest-link:hover{color:var(--brand-press);background:var(--brand-wash)}

.auth .sub{text-align:center;color:var(--ink);font-size:22px;font-weight:900;margin-top:5px;margin-bottom:22px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.field input{
  width:100%;height:44px;padding:0 14px;
  border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:var(--cream);font:inherit;font-size:14.5px;color:var(--ink);
  transition:border-color .16s,box-shadow .16s,background .16s;
}
.field input:focus{
  outline:none;border-color:var(--brand-press);background:var(--milk);
  box-shadow:0 0 0 3px rgba(232,180,0,.16);
}
.code-row{display:flex;gap:9px}
.code-row input{flex:1;min-width:0}
.code-row button{
  flex:none;padding:0 14px;height:44px;
  border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:var(--cream);
  font:inherit;font-size:13px;font-weight:700;color:var(--ink-soft);
  cursor:pointer;white-space:nowrap;
  transition:border-color .16s,color .16s,background .16s;
}
.code-row button:hover:not(:disabled){border-color:var(--brand-press);color:var(--ink);background:var(--brand-wash)}
.code-row button:disabled{opacity:.5;cursor:not-allowed}

.mode{
  display:flex;gap:2px;padding:3px;margin:22px 0 20px;
  background:var(--cream);border-radius:999px;
}
.mode button{
  flex:1;border:none;background:transparent;
  padding:8px;border-radius:999px;
  font:inherit;font-size:13.5px;font-weight:700;color:var(--ink-soft);
  cursor:pointer;transition:background .18s var(--ease),color .18s;
}
.mode button.on{background:var(--brand);color:var(--on-brand)}

/* ---------------- 待支付 ---------------- */

.pay-hero{
  max-width:520px;margin:0 auto 26px;
  background:linear-gradient(160deg,#FFE9A8,var(--brand-wash));
  color:var(--ink);
  border-radius:var(--r-lg);
  padding:28px 30px;text-align:center;
  box-shadow:var(--shadow-card);
}
.pay-hero .cap{font-size:12.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.04em}
.pay-hero .clock{
  font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1.1;
  margin:6px 0 14px;
  font-variant-numeric:tabular-nums;
}
.pay-hero .clock.done{color:#E5484D}
.pay-track{height:5px;border-radius:99px;background:rgba(92,61,0,.12);overflow:hidden}
.pay-fill{
  height:100%;border-radius:99px;background:var(--brand);
  transition:width 1s linear;
}
.pay-hero .exp{
  margin-top:14px;font-size:12.5px;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
}

.summary{
  max-width:520px;margin:0 auto;
  background:var(--milk);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--shadow-card);
}
.sum-row{
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  padding:16px 22px;
  border-bottom:1px solid var(--line-soft);
}
.sum-row:last-child{border-bottom:none}
.sum-k{font-size:13px;color:var(--ink-soft);flex:none}
.sum-v{font-size:14px;font-weight:600;text-align:right;line-height:1.5}
.sum-v.big{font-size:22px;font-weight:800;letter-spacing:-.03em}
.sum-actions{display:flex;gap:10px;padding:18px 22px}

/* ---------------- 订单卡 ---------------- */

.order{
  display:block;position:relative;overflow:hidden;
  padding:18px 20px 18px 22px;margin-bottom:12px;
  background:var(--milk);border-radius:var(--r-md);
  border:1.5px solid var(--line);
  text-align:left;width:100%;
  font:inherit;color:inherit;
  box-shadow:var(--shadow-card);
}

/* 左侧状态色条：扫一眼区分待支付 / 已支付 / 已取消 */
.order::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent,var(--line));
}
.order.s-wait{--accent:var(--brand)}
.order.s-done{--accent:#5CA97C}
.order.s-dead{--accent:#D8D0BE}

.order-hd{display:flex;align-items:baseline;gap:12px}
.order-title{
  flex:1;min-width:0;
  font-size:15.5px;font-weight:700;letter-spacing:-.01em;

<script>
'use strict';

/* ============================================================

   ============================================================ */

const NAMES = {

    ['爵士音乐节','上海市普陀区大渡河路 crosses 演艺中心',360],
    ['双十一脱口秀开放麦','杭州市西湖区黄龙体育中心',88],
    ['环球音乐节上海站','上海市浦东新区世博公园',520],
    ['格斗之夜','成都市高新区五粮液成都金融城演艺中心',450],
    ['城市马拉松开跑仪式','深圳市南山区深圳湾体育中心',0],

    ['陈奕迅 FEAR AND DREAMS 巡回演唱会','北京市朝阳区工人体育场',760,4,10],
    ['林俊杰 JJ20 FINAL LAP 世界巡回演唱会','上海市黄浦区淮海中路99号大麦中心体育馆',720,4,10],
    ['许巍「无尽光芒」巡回演唱会','成都市青羊区东郊记忆演艺中心',480,3,8],
    ['陶喆 Soul Power 巡回演唱会','广州市天河区天河北路珠江新城海心沙',560,4,10],
    ['毛不易「平凡的一天」巡演','深圳市龙岗区大运中心体育馆',480,3,8],
    ['谢天笑 滚雪球巡回演唱会','西安市雁塔区曲江国际会议中心',380,3,8],

};

let uid = 1000;
let seatId = 1000;
/* 订单号超出 Number.MAX_SAFE_INTEGER，必须走字符串，否则两笔订单会舍入成同一个数 */
let orderSeq = 7845129365720192512n;
const nextOrderNo = () => (orderSeq += 137n).toString();

const DB = {
  users:[{id:1,phone:'13800000001',password:'Aa123456'}],
  events:[],
  seats:{},   // eventId -> [{seatId,rowNo,colNo,status}]
  orders:[],
  tokens:{}   // refreshToken -> userId
};

NAMES.rush.forEach(([name,address,price],i)=>{
  DB.events.push({id:i+1,name,address,price,mode:1,rowCount:0,colCount:0,stock:1000-i*57});
});
NAMES.seat.forEach(([name,address,price,rows,cols],i)=>{
  const id = 100+i;
  DB.events.push({id,name,address,price,mode:2,rowCount:rows,colCount:cols,stock:0});
  const list=[];
  for(let r=1;r<=rows;r++){
    for(let c=1;c<=cols;c++){
      // 预置一些已售，制造真实的座位图状态
      const sold = ((r*7+c*13)%11===0);
      list.push({seatId:++seatId,rowNo:r,colNo:c,status:sold?1:0});
    }
  }
  DB.seats[id]=list;
});
// 让周杰伦这场（id 100）更好看一些
DB.seats[100].forEach(s=>{ if(s.colNo===3||s.colNo===8) s.status=1; });

// 预置订单：登录 13800000001 后「我的订单」即可看到三种状态
(function seedOrders(){
  const now=Date.now(), MIN=60000, HOUR=3600000, DAY=86400000;
  const mk=(eventId,seatId,amount,status,createdAgo,payAgo)=>{
    DB.orders.push({
      orderNo: nextOrderNo(), uid:1, eventId, seatId, amount, status,
      createTime: now-createdAgo,
      expireTime: now-createdAgo + 15*MIN,
      payTime: payAgo!=null ? now-payAgo : null
    });
  };
  // 抢票模式 · 已支付
  mk(1, null, 98, 1, 2*DAY, 2*DAY-3*MIN);
  // 选座模式 · 已支付（座位同步置为不可选，与座位图一致）
  const s1=DB.seats[101].find(s=>s.rowNo===2&&s.colNo===3);
  s1.status=1;
  mk(101, s1.seatId, 880, 1, 5*HOUR, 5*HOUR-2*MIN);
  // 抢票模式 · 待支付（倒计时仍在走）
  mk(3, null, 420, 0, 3*MIN, null);
  // 选座模式 · 已取消
  const s2=DB.seats[102].find(s=>s.rowNo===1&&s.colNo===1);
  mk(102, s2.seatId, 760, 2, 3*DAY, null);
})();

/* ============================================================
   二、模拟 API —— 严格对齐 docs/API.md 的 13 个端点
   ============================================================ */

const sleep = ms => new Promise(r=>setTimeout(r,ms));
const ok = data => ({code:'A200',message:'Success',data});
const fail = (code,message)=>({code,message,data:null});

const seatNo = n => String(n).padStart(2,'0');

const API = {
  'POST /api/auth/send-code': async ({phone})=>{
    await sleep(260);
    if(!/^1[3-9]\d{9}$/.test(phone)) return fail('C400','手机号格式不正确');
    return ok(null);
  },

  'POST /api/auth/sms-login': async ({phone,code})=>{
    await sleep(420);
    if(code!=='123456') return fail('C400','验证码错误或已过期');
    let u = DB.users.find(x=>x.phone===phone);
    if(!u){ u={id:++uid,phone,password:null}; DB.users.push(u); }
    return ok(auth(u));
  },

  'POST /api/auth/pwd-login': async ({phone,password})=>{
    await sleep(420);
    const u = DB.users.find(x=>x.phone===phone);
    if(!u || !u.password || u.password!==password) return fail('C401','账号或密码错误');
    return ok(auth(u));
  },

  'POST /api/auth/refresh': async ({refreshToken})=>{
    await sleep(200);
    const uid2 = DB.tokens[refreshToken];
    if(!uid2) return fail('C401','登录已过期，请重新登录');
    delete DB.tokens[refreshToken];
    return ok(auth(DB.users.find(x=>x.id===uid2)));
  },

  'POST /api/auth/logout': async ({refreshToken})=>{
    await sleep(160);
    delete DB.tokens[refreshToken];
    return ok(null);
  },

  'POST /api/auth/password': async ({newPassword,uid:me})=>{
    await sleep(380);
    const u = DB.users.find(x=>x.id===me);
    if(!u) return fail('C401','未登录');
    u.password = newPassword;
    return ok(null);
  },

  'GET /api/events': async ({mode,keyword,page,size})=>{
    await sleep(320);
    let list = DB.events.filter(e=>e.mode===Number(mode));
    const kw=(keyword||'').trim();
    if(kw) list = list.filter(e=>e.name.includes(kw));
    const total=list.length;
    const p=Number(page)||1, s=Number(size)||10;
    const records = list.slice((p-1)*s, p*s)
      .map(e=>({id:e.id,name:e.name,address:e.address,price:e.price}));
    return ok({total,records,page:p,size:s});
  },

  'GET /api/events/ticket': async ({eventId})=>{
    await sleep(280);
    const e = DB.events.find(x=>x.id===Number(eventId));
    if(!e) return fail('C404','活动不存在');
    return ok({id:e.id,name:e.name,address:e.address,price:e.price,stock:e.stock});
  },

  'GET /api/events/seat': async ({eventId})=>{
    await sleep(340);
    const e = DB.events.find(x=>x.id===Number(eventId));
    if(!e) return fail('C404','活动不存在');
    return ok({
      id:e.id,name:e.name,address:e.address,price:e.price,
      rowCount:e.rowCount,colCount:e.colCount,
      seats:DB.seats[e.id].map(s=>({rowNo:s.rowNo,colNo:s.colNo,seatId:s.seatId,status:s.status}))
    });
  },

  'POST /api/orders': async ({eventId,seatId:sid,uid:me})=>{
    await sleep(520);
    const e = DB.events.find(x=>x.id===Number(eventId));
    if(!e) return fail('C404','活动不存在');
    if(DB.orders.some(o=>o.uid===me && o.eventId===e.id && o.status!==2))
      return fail('C409','您已购买过该活动的票');

    let seat=null;
    if(e.mode===2){
      if(!sid) return fail('C400','请选择座位');
      seat = DB.seats[e.id].find(s=>s.seatId===Number(sid));
      if(!seat) return fail('C404','座位不存在');
      if(seat.status===1) return fail('C409','该座位已被抢占');
      seat.status=1;                      // 锁定
    }else{
      if(e.stock<=0) return fail('C409','票已售罄');
      e.stock--;                          // 预留
    }

    const o = {
      orderNo: nextOrderNo(), uid:me, eventId:e.id, seatId:seat?seat.seatId:null,
      amount:e.price, status:0,
      createTime: Date.now(),
      expireTime: Date.now() + 15*60*1000
    };
    DB.orders.push(o);
    return ok({
      orderNo:o.orderNo, amount:o.amount,
      expireTime:fmtTime(o.expireTime),
      eventName:e.name, eventAddress:e.address,
      seat: seat?{rowNo:seat.rowNo,colNo:seat.colNo}:null
    });
  },

  'POST /api/pay': async ({orderNo:no,uid:me})=>{
    await sleep(700);
    const o = DB.orders.find(x=>x.orderNo===String(no) && x.uid===me);
    if(!o) return fail('C404','订单不存在');
    if(o.status!==0) return fail('C409','订单状态不允许支付');
    o.status=1; o.payTime=Date.now();
    return ok(null);
  },

  'GET /api/orders': async ({orderNo:no,status,page,size,uid:me})=>{
    await sleep(340);
    let list = DB.orders.filter(o=>o.uid===me);
    if(no) list = list.filter(o=>String(o.orderNo)===String(no).trim());
    if(status!==undefined && status!=='' && status!==null) list = list.filter(o=>o.status===Number(status));
    list = list.slice().sort((a,b)=>b.createTime-a.createTime);
    const total=list.length, p=Number(page)||1, s=Number(size)||10;
    return ok({total,records:list.slice((p-1)*s,p*s).map(toVO),page:p,size:s});
  }
};

function auth(u){
  const refreshToken = 'rt-'+Math.random().toString(16).slice(2,10);
  DB.tokens[refreshToken]=u.id;
  return {
    accessToken:'mock.'+u.id+'.'+Date.now().toString(16),
    refreshToken,
    userInfo:{id:u.id, phone:u.phone}
  };
}

/* 超时关单 / 主动取消：置为已取消并归还资源，让演示能看出资源确实被释放 */
function closeOrder(o){
  if(!o || o.status!==0) return;
  o.status = 2;
  const e = DB.events.find(x=>x.id===o.eventId);
  if(e.mode===1) e.stock++;                       // 归还预留库存
  else { const s=DB.seats[e.id].find(x=>x.seatId===o.seatId); if(s) s.status=0; }
}

function toVO(o){
  const e = DB.events.find(x=>x.id===o.eventId);
  const s = o.seatId!=null ? DB.seats[o.eventId].find(x=>x.seatId===o.seatId) : null;
  return {
    orderNo:o.orderNo, eventId:o.eventId,
    eventName:e.name, eventAddress:e.address, eventPrice:e.price,
    amount:o.amount, status:o.status,
    seat: s?{rowNo:s.rowNo,colNo:s.colNo}:null,
    createTime:fmtTime(o.createTime),
    expireTime:fmtTime(o.expireTime),
    payTime: o.payTime?fmtTime(o.payTime):null
  };
}

const pad = n => String(n).padStart(2,'0');
/* 与 API 文档契约一致：ISO-8601（2026-10-03T15:03:00），展示层再转友好格式 */
/* ISO-8601（2026-10-03T15:03:00）→ 时间戳，兼容 ECharts/Safari 的解析差异 */
function parseTime(t){ return new Date(String(t).replace('T',' ').replace(/-/g,'/')).getTime(); }

function fmtTime(ts){
  const d=new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
const showTime = t => String(t||'').replace('T',' ').slice(0,16);

/* 路径变量名无法从路径本身推导（/api/events/101 → eventId 而非 events），显式声明 */
const PATH_PARAM = {
  'GET /api/events/ticket' : 'eventId',
  'GET /api/events/seat'   : 'eventId'
};

/* 路由分发：/api/events/101/seat → API 键 'GET /api/events/seat' + { eventId:'101' } */
function call(method, url, body={}){
  const [path, qs] = url.split('?');
  const params = Object.fromEntries(new URLSearchParams(qs||''));
  const key = method+' '+path.replace(/\/\d+/g,'');
  if(!API[key]) return Promise.resolve(fail('S500','接口不存在'));
  const name = PATH_PARAM[key];
  const vars = name ? {[name]:path.match(/\/(\d+)/)[1]} : {};
  return API[key]({...params, ...vars, ...body, uid: state.user?.id});
}

const req = {
  get:(u,b)=>call('GET',u,b),
  post:(u,b)=>call('POST',u,b)
};

try{

}catch(e){}

function persist(){
  try{
    localStorage.setItem(SKEY, JSON.stringify({
      user:state.user, accessToken:state.accessToken, refreshToken:state.refreshToken

const isAuth = () => !!state.accessToken;

  back:'<svg viewBox="0 0 14 14" fill="none"><path d="M8.5 2.5 4 7l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  search:'<svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  pin:'<svg viewBox="0 0 16 16" fill="none"><path d="M8 14.5S13 10.2 13 6.8A5 5 0 0 0 3 6.8C3 10.2 8 14.5 8 14.5Z" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="6.8" r="1.7" stroke="currentColor" stroke-width="1.4"/></svg>'
};

function renderNav(){
  const tabs = document.getElementById('tabs');
  const on = location.hash.split('/')[1] || 'events';
  const seg = [['events','抢票'],['seat','选座'],['orders','我的订单']];
  tabs.innerHTML = seg.map(([k,label])=>
    `<a class="tab ${on===k?'on':''}" href="#/${k}/1">${label}</a>`

  const right = document.getElementById('navRight');
  if(isAuth()){
    right.innerHTML = `
      <div class="account">
        <button class="user-btn" aria-haspopup="true">
          ${state.user.phone}
          <span class="caret">${ICON.caret}</span>
        </button>

/* ---- 5.3 选座详情 ---- */
async function viewSeat(id){
  state.pickedSeat=null;
  view.innerHTML = `<div class="page"><div class="sk" style="height:420px"></div></div>`;
  const r = await req.get(`/api/events/${id}/seat`);
  if(r.code!=='A200'){ view.innerHTML=`<div class="page"><div class="empty"><p>${esc(r.message)}</p></div></div>`; return; }
  const e=r.data;

  const byRow={};
  e.seats.forEach(s=>{ (byRow[s.rowNo] ||= []).push(s); });

  let rows='';
  for(let rn=1; rn<=e.rowCount; rn++){
    const mid=Math.ceil(e.colCount/2);
    const left=byRow[rn].slice(0,mid), right=byRow[rn].slice(mid);
    const cell = s => {
      const on = s.status===1?'taken':'free';
      return `<button class="seat ${on}" style="--r:${rn}"
        ${s.status===1?'disabled':`data-seat="${s.seatId}" data-row="${s.rowNo}" data-col="${s.colNo}"`}
        aria-label="${rn}排${s.colNo}座${s.status===1?' 不可选':''}">${s.colNo}</button>`;
    };
    rows += `<div class="seat-row">
      <span class="rowno">${rn}</span>
      ${left.map(cell).join('')}
      <span class="aisle"></span>
      ${right.map(cell).join('')}
    </div>`;
  }

  view.innerHTML=`
    <div class="page">
      <button class="back" data-back>${ICON.back} 返回</button>
      <div class="hall">
        <div class="meta-row" style="margin-bottom:20px">
          <span class="price"><span class="cur">¥</span>${e.price}</span>
        </div>
        <h2 style="font-family:'Noto Serif SC',serif;font-size:19px;font-weight:900">${esc(e.name)}</h2>
        <div class="addr" style="margin-top:12px;padding-top:12px">${ICON.pin}<span>${esc(e.address)}</span></div>

        <div class="hall-body"><div class="seats">${rows}</div></div>
        <div class="legend">
          <span><i class="k-free"></i>可选</span>
          <span><i class="k-on"></i>已选</span>
          <span><i class="k-taken"></i>不可选</span>
        </div>
        <div class="buy-row">
          <div class="picked" id="picked" style="display:none;margin-bottom:0"></div>
          <div class="note" id="seatNote">请选择一个座位</div>
          <button class="btn btn-primary" data-buy="${e.id}" disabled>确认购票</button>
        </div>
      </div>
    </div>`;

  const btn  = view.querySelector('[data-buy]');
  const note = view.querySelector('#seatNote');
  const box  = view.querySelector('#picked');

  /* 事件委托：单选，再次点击已选座位则取消 */
  function paintPick(){
    const p = state.pickedSeat;
    view.querySelectorAll('.seat').forEach(s=>{
      const hit = p && +s.dataset.seat === p.seatId;
      s.classList.toggle('on', !!hit);
      s.classList.toggle('free', s.dataset.seat ? !hit : false);
    });
    if(p){
      box.style.display='flex';
      box.innerHTML=`<span>${p.rowNo} 排 ${p.colNo} 座</span><button class="unset" aria-label="取消选择">×</button>`;
      box.querySelector('.unset').onclick=e=>{e.stopPropagation();state.pickedSeat=null;paintPick()};
      note.style.display='none';
      btn.disabled=false;
    }else{
      box.style.display='none';
      note.style.display='';
      btn.disabled=true;
    }
  }

  view.querySelector('.hall-body').addEventListener('click',e=>{
    const s = e.target.closest('.seat[data-seat]');
    if(!s) return;
    const cur = state.pickedSeat;
    state.pickedSeat = (cur && cur.seatId===+s.dataset.seat)
      ? null
      : {seatId:+s.dataset.seat, rowNo:+s.dataset.row, colNo:+s.dataset.col};
    paintPick();
  });

  paintPick();
}

async function viewOrders(page){
  if(!isAuth()){ location.hash='#/login'; return; }
  view.innerHTML=`
    <div class="page">
      <div class="hd"><h1>我的订单</h1></div>
      <div class="toolbar">
        <div class="search">
          ${ICON.search}
          <input id="ono" type="text" placeholder="请输入订单号" value="${esc(state.orderNo)}">
        </div>
        <div class="seg" id="seg">
          <button class="${state.orderFilter===''?'on':''}" data-s="">全部</button>
          <button class="${state.orderFilter==='0'?'on':''}" data-s="0">待支付</button>
          <button class="${state.orderFilter==='1'?'on':''}" data-s="1">已支付</button>
          <button class="${state.orderFilter==='2'?'on':''}" data-s="2">已取消</button>
        </div>
        <button class="btn btn-primary" id="doSearch" style="height:42px">搜索</button>
        <button class="btn btn-line" id="doReset" style="height:42px">重置</button>
      </div>
      <div id="olist"><div class="sk" style="height:80px;margin-bottom:12px"></div></div>
    </div>`;

  const input=view.querySelector('#ono');
  view.querySelector('#doSearch').onclick = ()=>{ state.orderNo = input.value.trim(); paint(1); };
  view.querySelector('#doReset').onclick  = ()=>{ input.value=''; state.orderNo=''; paint(1); };
  input.addEventListener('keydown',e=>{ if(e.key==='Enter') view.querySelector('#doSearch').click(); });
  view.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{
    state.orderFilter=b.dataset.s;
    view.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    paint(1);
  });

  async function paint(p){
    const box=view.querySelector('#olist');
    box.innerHTML=`<div class="sk" style="height:80px;margin-bottom:12px"></div>`;
    const q=new URLSearchParams({page:p,size:10});
    if(state.orderFilter!=='') q.set('status',state.orderFilter);
    if(state.orderNo) q.set('orderNo',state.orderNo);
    const r=await req.get('/api/orders?'+q);
    if(r.code!=='A200'){ box.innerHTML=`<div class="empty"><p>${esc(r.message)}</p></div>`; return; }
    if(!r.data.records.length){
      box.innerHTML=`<div class="empty"><p>还没有符合条件的订单</p></div>`;
      return;
    }
    const badge=s=>[['wait','待支付'],['done','已支付'],['dead','已取消']][s];
    const pages=Math.ceil(r.data.total/r.data.size);
    box.innerHTML=r.data.records.map(o=>{
      const [cls,label]=badge(o.status);
      const F=(k,v)=>`<span class="order-field"><span class="k">${k}</span>
          <span class="v num">${v}</span></span>`;
      return `<div class="order s-${cls}">
        <div class="order-hd">
          <span class="order-title">${esc(o.eventName)}</span>
          <span class="order-amt"><span class="lbl">应付金额</span><b class="num">¥${o.amount}</b></span>
          <span class="badge ${cls}">${label}</span>
        </div>
        <div class="order-addr">${ICON.pin}<span>${esc(o.eventAddress)}</span></div>
        <div class="order-grid">
          <div class="order-col">
            ${F('订单号', o.orderNo)}
            ${F('座位', o.seat?`${o.seat.rowNo} 排 ${o.seat.colNo} 座`:'不限座')}
            ${F('活动票价', '¥'+o.eventPrice)}
          </div>
          <div class="order-col">
            ${F('下单时间', showTime(o.createTime))}
            ${F('支付截止', showTime(o.expireTime))}
            ${F('支付时间', o.payTime?showTime(o.payTime):'—')}
          </div>
        </div>
        ${o.status===0?`<div class="order-actions">
          <span class="order-countdown num" data-exp="${o.expireTime}" data-no="${o.orderNo}"></span>
          <button class="btn btn-line" data-cancel-order="${o.orderNo}">取消订单</button>
          <button class="btn btn-primary" data-pay="${o.orderNo}">立即支付</button>
        </div>`:''}
      </div>`;
    }).join('')
    + (pages>1?`<div class="toolbar" style="justify-content:center;margin-top:10px">
        <button class="btn btn-line" ${p<=1?'disabled':''} data-p="${p-1}">上一页</button>
        <span style="color:var(--ink-soft);font-size:13px">${p} / ${pages}</span>
        <button class="btn btn-line" ${p>=pages?'disabled':''} data-p="${p+1}">下一页</button>
      </div>`:'');
    box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>paint(Number(b.dataset.p)));
    startTick(p);
  }

  /* 待支付卡片的倒计时；归零则关单并刷新，与服务端异步关单保持一致 */
  function startTick(p){
    clearInterval(state.timer);
    const tick=()=>{
      const box=view.querySelector('#olist');
      if(!box) return;
      const els=box.querySelectorAll('.order-countdown[data-exp]');
      let expired=false;
      els.forEach(el=>{
        const left=parseTime(el.dataset.exp)-Date.now();
        if(left<=0){ el.textContent='已超时'; expired=true; return; }
        el.textContent=`${pad(Math.floor(left/60000))}:${pad(Math.floor(left%60000/1000))}`;
      });
      if(expired){
        clearInterval(state.timer);
        els.forEach(el=>closeOrder(DB.orders.find(x=>x.orderNo===String(el.dataset.no))));
        toast('订单已超时关闭');
        paint(p);
      }
    };
    tick();
    state.timer=setInterval(tick,1000);
  }
  paint(page);
}

function viewLogin(){
  clearInterval(state.timer);
  view.innerHTML=`
    <div class="page">
      <div class="auth">
        <h1>Ticket-System</h1>
        <p class="sub">高并发票务系统</p>

        <div class="mode" id="mode">

          <button data-m="pwd">密码登录</button>
        </div>

        <form id="form">
          <div class="field">
            <label for="phone">手机号</label>
            <input id="phone" type="tel" inputmode="numeric" placeholder="请输入手机号" autocomplete="tel">
          </div>

          <div class="field" id="f-code">
            <label for="code">验证码</label>
            <div class="code-row">
              <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="请输入验证码">
              <button type="button" id="send">获取验证码</button>
            </div>
          </div>

          <div class="field" id="f-pwd" style="display:none">
            <label for="pwd">密码</label>
            <input id="pwd" type="password" placeholder="请输入密码" autocomplete="current-password">
          </div>

          <button class="btn btn-primary btn-block" type="submit" id="submit">登录</button>
        </form>
        <button type="button" class="guest-link" id="guest">游客模式进入</button>
      </div>
    </div>`;

  let mode='sms';
  const fCode=view.querySelector('#f-code');
  const fPwd =view.querySelector('#f-pwd');
  const send =view.querySelector('#send');

  view.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{
    view.querySelectorAll('#mode button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    mode=b.dataset.m;
    const sms = mode==='sms';
    fCode.style.display = sms?'':'none';
    fPwd.style.display  = sms?'none':'';
  });

  send.onclick=async()=>{
    const phone=view.querySelector('#phone').value.trim();
    send.disabled=true; send.textContent='发送中';
    const r=await req.post('/api/auth/send-code',{phone});
    if(r.code!=='A200'){ toast(r.message); send.disabled=false; send.textContent='获取验证码'; return; }
    let n=60;
    send.textContent=`${n}s 后重发`;
    const tick=setInterval(()=>{
      n--;
      if(n<=0){ clearInterval(tick); send.disabled=false; send.textContent='获取验证码'; }
      else send.textContent=`${n}s 后重发`;
    },1000);
    toast('验证码已发送');
  };

  /* 游客模式：不登录直接浏览，购票等操作仍会被拦截到登录页 */
  view.querySelector('#guest').onclick=()=>{ location.hash='#/events/1'; };

  view.querySelector('#form').onsubmit=async e=>{
    e.preventDefault();
    const phone=view.querySelector('#phone').value.trim();
    const btn=view.querySelector('#submit');
    const body = mode==='sms'
      ? {phone, code:view.querySelector('#code').value.trim()}
      : {phone, password:view.querySelector('#pwd').value};
    btn.disabled=true; btn.textContent='登录中';
    const r = mode==='sms'
      ? await req.post('/api/auth/sms-login',body)
      : await req.post('/api/auth/pwd-login',body);
    btn.disabled=false; btn.textContent='登录';
    if(r.code!=='A200'){ toast(r.message); return; }
    state.accessToken=r.data.accessToken;
    state.refreshToken=r.data.refreshToken;
    state.user=r.data.userInfo;
    persist();
    toast('登录成功');
    location.hash='#/events/1';
  };
}

   ============================================================ */

const ROUTES = {
  events: (p)=>viewEvents(1,Number(p)||1),
  seat:   (p)=>viewEvents(2,Number(p)||1),
  e:      (p)=>{
    const ev = DB.events.find(x=>x.id===Number(p));

    else if(ev.mode===1) viewTicket(p);
    else viewSeat(p);

  login:  ()=>viewLogin()
};

function notFound(msg){

    <p style="margin-top:14px"><a class="btn btn-line" href="#/events/1" style="height:38px;padding:0 18px">返回首页</a></p>
  </div></div>`;
}

function paint(page){
  clearInterval(state.timer);
  const [r,param]=(location.hash||'#/events/1').slice(2).split('/');
  /* 登录页脱离常规布局：整屏独立，不显示顶部导航 */

/* ============================================================
   七、全局交互
   ============================================================ */

function toast(msg){
  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),240)},2200);
}

const mask=document.getElementById('mask');
function openModal(html){ document.getElementById('modal').innerHTML=html; mask.classList.add('on'); }
function closeModal(){ mask.classList.remove('on'); }
mask.addEventListener('click',e=>{ if(e.target===mask) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

function needLogin(){
  toast('请先登录');
  setTimeout(()=>{location.hash='#/login'},600);
  return true;
}

document.addEventListener('click', async e=>{
  const t=e.target;

  const go=t.closest('[data-go]');
  if(go){ location.hash=go.dataset.go; return; }

  if(t.closest('[data-back]')){ history.length>1?history.back():(location.hash='#/events/1'); return; }

  const act=t.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='tologin'){ location.hash='#/login'; return; }

    if(a==='logout'){
      await req.post('/api/auth/logout',{refreshToken:state.refreshToken});
      state.user=state.accessToken=state.refreshToken=null;
      persist(); toast('已退出登录');
      location.hash='#/events/1'; paint(); return;
    }

    if(a==='chpwd'){
      openModal(`
        <h3>修改密码</h3>
        <form id="pw">
          <div class="field">
            <label for="np">新密码</label>
            <input id="np" type="password" placeholder="请输入新密码" autocomplete="new-password">
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-line" data-close>取消</button>
            <button type="submit" class="btn btn-primary">保存</button>
          </div>
        </form>`);
      document.getElementById('pw').onsubmit=async ev=>{
        ev.preventDefault();
        const v=document.getElementById('np').value;
        if(v.length<8||v.length>20){ toast('密码长度需为 8–20 位'); return; }
        const r=await req.post('/api/auth/password',{newPassword:v});
        if(r.code!=='A200'){ toast(r.message); return; }
        closeModal();
        state.user=state.accessToken=state.refreshToken=null; persist();
        toast('密码已修改，请重新登录');
        location.hash='#/login';
      };
      return;
    }
  }

  if(t.closest('[data-close]')){ closeModal(); return; }

  /* 购票 */
  const buy=t.closest('[data-buy]');
  if(buy){
    if(!isAuth()){ needLogin(); return; }
    const eid=buy.dataset.buy;
    const ev=DB.events.find(x=>x.id===Number(eid));
    const body = ev.mode===2 && state.pickedSeat
      ? {eventId:eid, seatId:state.pickedSeat.seatId}
      : {eventId:eid};

    buy.disabled=true; buy.textContent='提交中';
    const r=await req.post('/api/orders',body);
    buy.disabled=false; buy.textContent = ev.mode===2?'确认购票':'立即购票';

    if(r.code!=='A200'){ toast(r.message); return; }
    location.hash='#/orders/1';
    return;
  }

  /* 支付（订单卡片内） */
  const pay=t.closest('[data-pay]');
  if(pay){
    pay.disabled=true; pay.textContent='支付中';
    const r=await req.post('/api/pay',{orderNo:pay.dataset.pay});
    pay.disabled=false; pay.textContent='立即支付';
    toast(r.code==='A200'?'支付成功':r.message);
    if(r.code==='A200') paint();
    return;
  }

  /* 取消订单（订单卡片内） */
  const cancel=t.closest('[data-cancel-order]');
  if(cancel){
    cancel.disabled=true; cancel.textContent='取消中';
    closeOrder(DB.orders.find(x=>x.orderNo===String(cancel.dataset.cancelOrder)));
    toast('订单已取消，库存与座位已归还');
    paint();
    return;
  }
});

paint();
</script>
</body>
</html>
