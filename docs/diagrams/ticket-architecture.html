<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>架构图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ARCHITECTURE · TICKET SYSTEM</p>
    <h1>架构图</h1>

    <svg viewBox="0 0 1120 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ticket-architecture-title ticket-architecture-desc">
      <title id="ticket-architecture-title">架构图</title>
      <desc id="ticket-architecture-desc">高并发票务系统的模块化单体架构：Vue 前端经 HTTP 调用 Spring Boot 单体，单体聚合 booking、auth、event 三个业务模块与 common 公共基座，向下访问 MySQL、Redis 与 Kafka 三项业务依赖；另有 Prometheus 与 Grafana 构成的可观测性横条，从外部拉取指标、不参与业务链路。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ 分区（最先画） ============ -->
      <!-- 单体进程分区 -->
      <rect x="120" y="168" width="880" height="304" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="132" y="170" width="176" height="14" rx="2" fill="#f5f5f5"/>
      <text x="136" y="182" fill="rgba(45,49,66,0.55)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SPRING BOOT 模块化单体 :8600</text>
      <!-- 基础设施分区 -->
      <rect x="120" y="528" width="880" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="132" y="530" width="122" height="14" rx="2" fill="#f5f5f5"/>
      <text x="136" y="542" fill="rgba(45,49,66,0.55)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DOCKER COMPOSE 基础设施</text>

      <!-- ============ 箭头（先线后盒） ============ -->
      <!-- 前端 → 单体：外部 HTTP -->
      <path d="M 560 120 V 200" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="566" y="146" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="570" y="156" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTP /api</text>

      <!-- common → MySQL：同步读写 -->
      <path d="M 328 456 V 568" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- common → Redis：同步缓存与锁 -->
      <path d="M 560 456 V 568" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- common → Kafka：Outbox 中继投递 -->
      <path d="M 776 456 V 568" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="732" y="490" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="768" y="500" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" text-anchor="end" letter-spacing="0.06em">投递</text>

      <!-- Kafka → common：异步关单消费 -->
      <path d="M 808 568 V 456" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="816" y="506" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="820" y="516" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" letter-spacing="0.06em">消费</text>

      <!-- ============ 前端 ============ -->
      <rect x="472" y="48" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="48" width="176" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="480" y="54" width="34" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="497" y="63" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="522" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">Vue 3 SPA</text>
      <text x="560" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:5600</text>

      <!-- ============ 单体：boot 壳 ============ -->
      <rect x="432" y="200" width="256" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="200" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="440" y="206" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="460" y="215" fill="rgba(45,49,66,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BOOT</text>
      <text x="488" y="218" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">ticket-boot</text>
      <text x="680" y="217" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">:8600</text>
      <text x="560" y="244" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">唯一可运行入口</text>

      <!-- ============ 单体：业务模块行 ============ -->
      <!-- booking -->
      <rect x="232" y="288" width="192" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="288" width="192" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="240" y="294" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="266" y="303" fill="rgba(45,49,66,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODULE</text>
      <text x="300" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">ticket-booking</text>
      <line x1="240" y1="320" x2="416" y2="320" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="328" y="344" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">下单 · 抢票 · 选座 · 支付</text>
      <!-- auth -->
      <rect x="464" y="288" width="192" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="288" width="192" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="472" y="294" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="498" y="303" fill="rgba(45,49,66,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODULE</text>
      <text x="532" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">ticket-auth</text>
      <line x1="472" y1="320" x2="648" y2="320" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="560" y="344" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">登录认证</text>
      <!-- event -->
      <rect x="696" y="288" width="192" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="696" y="288" width="192" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="704" y="294" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="730" y="303" fill="rgba(45,49,66,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODULE</text>
      <text x="764" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">ticket-event</text>
      <line x1="704" y1="320" x2="880" y2="320" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="792" y="344" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">活动 · 库存 · 座位</text>

      <!-- ============ 单体：common 底座 ============ -->
      <rect x="232" y="384" width="656" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="384" width="656" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="484" y="390" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="510" y="399" fill="rgba(45,49,66,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODULE</text>
      <text x="542" y="402" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">ticket-common</text>
      <text x="560" y="434" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">公共基础能力</text>
      <text x="136" y="202" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'Noto Sans SC', monospace" letter-spacing="0.04em">依赖方向 booking → auth / event → common</text>

      <!-- ============ 基础设施 ============ -->
      <!-- MySQL -->
      <rect x="232" y="568" width="192" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="568" width="192" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="240" y="574" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="252" y="583" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="272" y="586" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">MySQL</text>
      <text x="416" y="585" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">:3306</text>
      <line x1="240" y1="596" x2="416" y2="596" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="328" y="620" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">业务数据持久化</text>
      <!-- Redis（焦点） -->
      <rect x="464" y="568" width="192" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="568" width="192" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="472" y="574" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="494" y="583" fill="rgba(235,108,54,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
      <text x="524" y="586" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">Redis</text>
      <text x="648" y="585" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">:6379 · Redisson</text>
      <line x1="472" y1="596" x2="648" y2="596" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="560" y="620" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">缓存 · 分布式锁</text>
      <!-- Kafka（焦点） -->
      <rect x="696" y="568" width="192" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="696" y="568" width="192" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="704" y="574" width="26" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="717" y="583" fill="rgba(235,108,54,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MQ</text>
      <text x="738" y="586" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">Kafka</text>
      <text x="880" y="585" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">:9092</text>
      <line x1="704" y1="596" x2="880" y2="596" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="792" y="620" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">异步消息</text>

      <!-- ============ 可观测性横条（辅助工具，非业务依赖） ============ -->
      <text x="136" y="736" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'Noto Sans SC', monospace" letter-spacing="0.04em">可观测性</text>
      <rect x="232" y="696" width="656" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="696" width="656" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="240" y="702" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="258" y="711" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OBS</text>
      <text x="284" y="714" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">指标采集与可视化</text>
      <line x1="240" y1="728" x2="880" y2="728" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="560" y="748" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">Prometheus :9090 定时拉取 · Grafana :3000 面板呈现 · 外部采集，不参与业务链路</text>

      <!-- ============ 图例（底部横条） ============ -->
      <line x1="48" y1="816" x2="1072" y2="816" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="840" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <g font-size="9" fill="#4f5d75" font-family="'Geist Mono', 'Noto Sans SC', monospace">
        <text x="120" y="840">实线 = 同步调用</text>
        <text x="250" y="840">虚线 = 异步消息</text>
        <text x="380" y="840">蓝色 = 外部 HTTP</text>
      </g>
      <rect x="520" y="832" width="8" height="8" rx="2" fill="rgba(235,108,54,0.30)" stroke="#eb6c36" stroke-width="1"/>
      <text x="536" y="840" fill="#4f5d75" font-size="9" font-family="'Noto Sans SC', sans-serif">并发主战场</text>
    </svg>
  </div>
</body>
</html>
