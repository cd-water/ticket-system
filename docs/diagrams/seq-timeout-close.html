<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超时关单时序图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --color-soft: #7a8399; --color-accent: #eb6c36;
      --font-sans: 'Geist','Noto Sans SC',system-ui,sans-serif;
      --font-serif: 'Instrument Serif','Noto Serif SC',serif;
      --font-mono: 'Geist Mono',ui-monospace,monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: .66rem; font-weight: 500; letter-spacing: .18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: .5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + .75rem, 2rem); font-weight: 400;
         letter-spacing: -.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">SEQUENCE · TIMEOUT CLOSE · TICKET SYSTEM</p>
    <h1>超时关单时序图（抢票 / 选座）</h1>

    <svg viewBox="0 0 1120 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-timeout-title seq-timeout-desc">
      <title id="seq-timeout-title">超时关单时序图</title>
      <desc id="seq-timeout-desc">超时关单流程，抢票与选座双模式：中继轮询发件箱到期消息经 RabbitMQ 投递关单消费者，消费者先以订单状态 CAS 关单；rows=1 时抢票模式回补 Redis 库存并删除一人一单资格键，选座模式清除座位位图、座位锁随 TTL 自动过期；rows=0 表示订单已支付，静默 ACK。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- 生命线 -->
      <g stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3">
        <line x1="100" y1="96" x2="100" y2="648"/>
        <line x1="325" y1="96" x2="325" y2="648"/>
        <line x1="550" y1="96" x2="550" y2="648"/>
        <line x1="775" y1="96" x2="775" y2="648"/>
        <line x1="1000" y1="96" x2="1000" y2="648"/>
      </g>

      <!-- 激活条 -->
      <rect x="96" y="152" width="8" height="96" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="546" y="272" width="8" height="344" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="996" y="152" width="8" height="240" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="771" y="476" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="771" y="556" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- 消息 -->
      <line x1="104" y1="160" x2="996" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="160" y="138" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="212" y="148" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">扫 status=0 且到期</text>
      <line x1="996" y1="200" x2="104" y2="200" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="160" y="178" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="212" y="188" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">到期消息批次</text>
      <line x1="104" y1="240" x2="321" y2="240" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="152" y="218" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="212" y="228" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">publish · 交换机/路由键</text>
      <line x1="329" y1="280" x2="546" y2="280" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="402" y="258" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="438" y="268" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">投递关单消息</text>

      <!-- CAS 幂等关单 -->
      <line x1="558" y1="352" x2="996" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="831" y="330" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="887" y="340" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">CAS · UPDATE 0→2</text>
      <line x1="996" y1="384" x2="558" y2="384" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="849" y="362" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="887" y="372" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">rows = 1 / 0</text>

      <!-- 侧注：竞态输家 -->
      <text x="566" y="406" fill="#4f5d75" font-size="11" font-style="italic" font-family="'Instrument Serif','Noto Serif SC',serif">rows=0 → 订单已支付，静默 ACK</text>

      <!-- ALT：双模式回补 -->
      <rect x="486" y="416" width="352" height="164" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="486" y="416" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="506" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="498" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" letter-spacing="0.04em">[rows=1 · 抢票]</text>
      <line x1="558" y1="480" x2="771" y2="480" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="597" y="458" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="665" y="468" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">INCR 库存 · DEL 资格键</text>
      <line x1="494" y1="504" x2="830" y2="504" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="498" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" letter-spacing="0.04em">[else rows=1 · 选座]</text>
      <line x1="558" y1="560" x2="771" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="599" y="538" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="665" y="548" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">SETBIT 0 · 清座位位图</text>

      <!-- ACK -->
      <line x1="546" y1="612" x2="329" y2="612" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="414" y="590" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="438" y="600" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ACK</text>

      <!-- 参与者 -->
      <g font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">
        <rect x="24" y="48" width="152" height="48" rx="6" fill="#f5f5f5"/><rect x="24" y="48" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="100" y="70" fill="#2d3142">中继</text><text x="100" y="86" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono',monospace">Outbox Relay</text>
        <rect x="249" y="48" width="152" height="48" rx="6" fill="#f5f5f5"/><rect x="249" y="48" width="152" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="325" y="70" fill="#2d3142">RabbitMQ</text><text x="325" y="86" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono',monospace">:5672</text>
        <rect x="474" y="48" width="152" height="48" rx="6" fill="#f5f5f5"/><rect x="474" y="48" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="550" y="70" fill="#2d3142">关单消费者</text><text x="550" y="86" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono',monospace">Close Consumer</text>
        <rect x="699" y="48" width="152" height="48" rx="6" fill="#f5f5f5"/><rect x="699" y="48" width="152" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="775" y="70" fill="#2d3142">Redis</text><text x="775" y="86" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono',monospace">:6379</text>
        <rect x="924" y="48" width="152" height="48" rx="6" fill="#f5f5f5"/><rect x="924" y="48" width="152" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="1000" y="70" fill="#2d3142">MySQL</text><text x="1000" y="86" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono',monospace">:3306 · t_order/t_outbox</text>
      </g>

      <!-- 图例 -->
      <line x1="48" y1="696" x2="1072" y2="696" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <g font-size="9" fill="#4f5d75" font-family="'Geist Mono','Noto Sans SC',monospace">
        <text x="120" y="720">实线 = 同步调用</text>
        <text x="260" y="720">虚线空心 = 异步</text>
        <text x="410" y="720">虚线实心 = 返回</text>
        <text x="560" y="720">橙色 = 资源释放</text>
      </g>
    </svg>
  </div>
</body>
</html>
