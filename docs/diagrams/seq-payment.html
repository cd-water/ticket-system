<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付时序图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --color-soft: #7a8399; --color-accent: #eb6c36;
      --font-sans: 'Geist','Noto Sans SC',system-ui,sans-serif;
      --font-serif: 'Instrument Serif','Noto Serif SC',serif;
      --font-mono: 'Geist Mono',ui-monospace,monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: .66rem; font-weight: 500; letter-spacing: .18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: .5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + .75rem, 2rem); font-weight: 400;
         letter-spacing: -.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">SEQUENCE · PAYMENT · TICKET SYSTEM</p>
    <h1>支付时序图（微信 Native）</h1>

    <svg viewBox="0 0 1120 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-payment-title seq-payment-desc">
      <title id="seq-payment-title">支付时序图</title>
      <desc id="seq-payment-desc">支付流程：发起支付落支付单并调微信 Native 下单返回二维码链接，用户扫码后微信异步回调，服务端验签解密后单事务完成订单与支付单 CAS、DB 库存条件扣减或座位置已售并写入短信发件箱；CAS 胜者 ACK 微信，败者（订单已被超时关单）发起退款，前端轮询后端订单状态获得最终结果。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- 生命线 -->
      <g stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3">
        <line x1="120" y1="96" x2="120" y2="724"/>
        <line x1="440" y1="96" x2="440" y2="724"/>
        <line x1="760" y1="96" x2="760" y2="724"/>
        <line x1="1000" y1="96" x2="1000" y2="724"/>
      </g>

      <!-- 激活条 -->
      <rect x="436" y="152" width="8" height="556" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="996" y="196" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="996" y="444" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="756" y="236" width="8" height="52" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="756" y="396" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="756" y="544" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="756" y="616" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- 发起支付 -->
      <line x1="128" y1="160" x2="436" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="218" y="138" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="148" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">POST /api/pay · orderNo</text>
      <line x1="448" y1="200" x2="996" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="538" y="178" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="188" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">INSERT t_payment · status=0</text>
      <line x1="448" y1="240" x2="756" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="528" y="218" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="228" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">Native 下单 · out_trade_no</text>
      <line x1="756" y1="280" x2="448" y2="280" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="568" y="258" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="268" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">code_url</text>
      <line x1="436" y1="320" x2="128" y2="320" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="216" y="298" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="308" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">code_url → 二维码</text>
      <path d="M 124 348 h 28 v 16 h -20" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="164" y="362" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" letter-spacing="0.06em">扫码 · 确认支付</text>

      <!-- 异步回调 -->
      <line x1="756" y1="400" x2="448" y2="400" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="524" y="378" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="388" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">支付通知 · 验签解密</text>

      <!-- 单事务落账 -->
      <line x1="448" y1="448" x2="996" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="620" y="426" width="204" height="12" rx="2" fill="#f5f5f5"/>
      <text x="722" y="436" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">事务：CAS×2 + 库存-1/座位已售 + 发件箱短信</text>

      <!-- ALT：CAS 竞态仲裁 -->
      <rect x="416" y="488" width="368" height="152" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="416" y="488" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="436" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="428" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" letter-spacing="0.04em">[rows=1 · 支付成功]</text>
      <line x1="448" y1="548" x2="756" y2="548" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="558" y="526" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="602" y="536" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">HTTP 200 ACK</text>
      <line x1="424" y1="572" x2="776" y2="572" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="428" y="594" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" letter-spacing="0.04em">[else rows=0 · 已关单]</text>
      <line x1="448" y1="620" x2="756" y2="620" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="556" y="598" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="602" y="608" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">发起退款</text>

      <!-- 前端轮询 -->
      <line x1="128" y1="672" x2="436" y2="672" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="232" y="650" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="660" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">轮询订单状态</text>
      <line x1="436" y1="704" x2="128" y2="704" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="242" y="682" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="692" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">已支付 / 退款中</text>

      <!-- 参与者 -->
      <g font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">
        <rect x="44" y="48" width="152" height="48" rx="6" fill="#f5f5f5"/><rect x="44" y="48" width="152" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="120" y="70" fill="#2d3142">用户</text><text x="120" y="86" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono',monospace">:5600 前端</text>
        <rect x="364" y="48" width="152" height="48" rx="6" fill="#f5f5f5"/><rect x="364" y="48" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="440" y="70" fill="#2d3142">ticket-booking</text><text x="440" y="86" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono',monospace">支付服务 :8600</text>
        <rect x="684" y="48" width="152" height="48" rx="6" fill="#f5f5f5"/><rect x="684" y="48" width="152" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="760" y="70" fill="#2d3142">微信支付</text><text x="760" y="86" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono',monospace">Native API</text>
        <rect x="924" y="48" width="152" height="48" rx="6" fill="#f5f5f5"/><rect x="924" y="48" width="152" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="1000" y="70" fill="#2d3142">MySQL</text><text x="1000" y="86" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono',monospace">:3306 · t_payment/t_order</text>
      </g>

      <!-- 图例 -->
      <line x1="48" y1="756" x2="1072" y2="756" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="780" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <g font-size="9" fill="#4f5d75" font-family="'Geist Mono','Noto Sans SC',monospace">
        <text x="120" y="780">实线 = 同步调用</text>
        <text x="260" y="780">蓝色 = 渠道调用</text>
        <text x="400" y="780">虚线空心 = 异步回调</text>
        <text x="560" y="780">橙色 = 关键成功路径</text>
      </g>
    </svg>
  </div>
</body>
</html>
