<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据库 ER 图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER DATA MODEL · TICKET SYSTEM</p>
    <h1>数据库 ER 图</h1>

    <svg viewBox="0 0 1120 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ticket-er-title ticket-er-desc">
      <title id="ticket-er-title">数据库 ER 图</title>
      <desc id="ticket-er-desc">高并发票务系统七张表的实体关系图：活动派生出库存与座位，用户、活动、座位三方汇聚为订单，订单对应一张微信支付单，订单事实经消息发件箱表可靠投递。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ 关系线（先画线，后画盒子） ============ -->
      <!-- 库存 1:1 活动 -->
      <path d="M 376 136 H 472" stroke="#4f5d75" stroke-width="1" fill="none"/>
      <!-- 活动 1:N 座位 -->
      <path d="M 648 136 H 744" stroke="#4f5d75" stroke-width="1" fill="none"/>
      <!-- 活动 1:N 订单 -->
      <path d="M 560 208 V 320" stroke="#4f5d75" stroke-width="1" fill="none"/>
      <!-- 用户 1:N 订单 -->
      <path d="M 376 406 H 472" stroke="#4f5d75" stroke-width="1" fill="none"/>
      <!-- 座位 1:0..1 订单（直角折线，r=8 圆角） -->
      <path d="M 832 194 V 248 Q 832 256 824 256 H 608 Q 600 256 600 264 V 320" stroke="#4f5d75" stroke-width="1" fill="none"/>
      <!-- 订单 1:1 支付单 -->
      <path d="M 648 406 H 744" stroke="#4f5d75" stroke-width="1" fill="none"/>
      <!-- 订单 1:N 发件箱（payload.orderNo 逻辑引用，无外键，虚线） -->
      <path d="M 560 506 V 560" stroke="#4f5d75" stroke-width="1" fill="none" stroke-dasharray="4,3"/>

      <!-- ============ 基数标注（离线 8px 以上） ============ -->
      <g font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399" letter-spacing="0.06em">
        <text x="384" y="126">0..1</text>
        <text x="462" y="126" text-anchor="end">1</text>
        <text x="656" y="126">1</text>
        <text x="734" y="126" text-anchor="end">N</text>
        <text x="568" y="222">1</text>
        <text x="568" y="312">N</text>
        <text x="384" y="396">1</text>
        <text x="462" y="396" text-anchor="end">N</text>
        <text x="840" y="208">0..1</text>
        <text x="608" y="312">N</text>
        <text x="656" y="396">1</text>
        <text x="734" y="396" text-anchor="end">0..1</text>
        <text x="568" y="520">1</text>
        <text x="568" y="552">N</text>
      </g>

      <!-- ============ 实体：用户 ============ -->
      <rect x="200" y="364" width="176" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="364" width="176" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="210" y="372" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="227" y="381" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
      <text x="252" y="382" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">t_user</text>
      <text x="366" y="381" fill="#7a8399" font-size="9" font-family="'Noto Sans SC', sans-serif" text-anchor="end">用户表</text>
      <line x1="210" y1="392" x2="366" y2="392" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <g font-family="'Geist Mono', monospace" font-size="9">
        <text x="212" y="408" fill="#2d3142"># id BIGINT</text>
        <text x="212" y="422" fill="#4f5d75">phone VARCHAR</text>
        <text x="212" y="436" fill="#4f5d75">password VARCHAR ?</text>
      </g>

      <!-- ============ 实体：活动（枢纽） ============ -->
      <rect x="472" y="64" width="176" height="144" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="64" width="176" height="144" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="482" y="72" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="499" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
      <text x="524" y="82" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">t_event</text>
      <text x="638" y="81" fill="#7a8399" font-size="9" font-family="'Noto Sans SC', sans-serif" text-anchor="end">活动表</text>
      <line x1="482" y1="92" x2="638" y2="92" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <g font-family="'Geist Mono', monospace" font-size="9">
        <text x="484" y="108" fill="#2d3142"># id BIGINT</text>
        <text x="484" y="122" fill="#4f5d75">name VARCHAR</text>
        <text x="484" y="136" fill="#4f5d75">address VARCHAR</text>
        <text x="484" y="150" fill="#4f5d75">price DECIMAL</text>
        <text x="484" y="164" fill="#4f5d75">mode TINYINT</text>
        <text x="484" y="178" fill="#4f5d75">row_count INT</text>
        <text x="484" y="192" fill="#4f5d75">col_count INT</text>
      </g>

      <!-- ============ 实体：库存 ============ -->
      <rect x="200" y="92" width="176" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="92" width="176" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="210" y="100" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="227" y="109" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
      <text x="252" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">t_event_stock</text>
      <text x="366" y="109" fill="#7a8399" font-size="9" font-family="'Noto Sans SC', sans-serif" text-anchor="end">库存表</text>
      <line x1="210" y1="120" x2="366" y2="120" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <g font-family="'Geist Mono', monospace" font-size="9">
        <text x="212" y="136" fill="#2d3142"># id BIGINT</text>
        <text x="212" y="150" fill="#2d3142">→ event_id BIGINT</text>
        <text x="212" y="164" fill="#4f5d75">stock INT</text>
      </g>

      <!-- ============ 实体：座位 ============ -->
      <rect x="744" y="78" width="176" height="116" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="78" width="176" height="116" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="754" y="86" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="771" y="95" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
      <text x="796" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">t_event_seat</text>
      <text x="910" y="95" fill="#7a8399" font-size="9" font-family="'Noto Sans SC', sans-serif" text-anchor="end">座位表</text>
      <line x1="754" y1="106" x2="910" y2="106" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <g font-family="'Geist Mono', monospace" font-size="9">
        <text x="756" y="122" fill="#2d3142"># id BIGINT</text>
        <text x="756" y="136" fill="#2d3142">→ event_id BIGINT</text>
        <text x="756" y="150" fill="#4f5d75">row_no INT</text>
        <text x="756" y="164" fill="#4f5d75">col_no INT</text>
        <text x="756" y="178" fill="#4f5d75">status TINYINT</text>
      </g>

      <!-- ============ 实体：订单（聚合根，唯一焦点） ============ -->
      <rect x="472" y="320" width="176" height="186" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="320" width="176" height="186" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="482" y="328" width="34" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="499" y="337" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
      <text x="524" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">t_order</text>
      <text x="638" y="337" fill="#7a8399" font-size="9" font-family="'Noto Sans SC', sans-serif" text-anchor="end">订单表</text>
      <line x1="482" y1="348" x2="638" y2="348" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <g font-family="'Geist Mono', monospace" font-size="9">
        <text x="484" y="364" fill="#2d3142"># id BIGINT</text>
        <text x="484" y="378" fill="#4f5d75">order_no BIGINT</text>
        <text x="484" y="392" fill="#2d3142">→ user_id BIGINT</text>
        <text x="484" y="406" fill="#2d3142">→ event_id BIGINT</text>
        <text x="484" y="420" fill="#2d3142">→ seat_id BIGINT ?</text>
        <text x="484" y="434" fill="#4f5d75">amount DECIMAL</text>
        <text x="484" y="448" fill="#4f5d75">status TINYINT</text>
        <text x="484" y="462" fill="#4f5d75">expire_time DATETIME</text>
        <text x="484" y="476" fill="#4f5d75">pay_time DATETIME ?</text>
        <text x="484" y="490" fill="#4f5d75">create_time DATETIME</text>
      </g>

      <!-- ============ 实体：支付单 ============ -->
      <rect x="744" y="364" width="176" height="172" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="364" width="176" height="172" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="754" y="372" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="771" y="381" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
      <text x="796" y="382" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">t_payment</text>
      <text x="910" y="381" fill="#7a8399" font-size="9" font-family="'Noto Sans SC', sans-serif" text-anchor="end">支付单表</text>
      <line x1="754" y1="392" x2="910" y2="392" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <g font-family="'Geist Mono', monospace" font-size="9">
        <text x="756" y="408" fill="#2d3142"># id BIGINT</text>
        <text x="756" y="422" fill="#4f5d75">out_trade_no BIGINT</text>
        <text x="756" y="436" fill="#2d3142">→ order_id BIGINT</text>
        <text x="756" y="450" fill="#4f5d75">amount DECIMAL</text>
        <text x="756" y="464" fill="#4f5d75">status TINYINT</text>
        <text x="756" y="478" fill="#4f5d75">code_url VARCHAR ?</text>
        <text x="756" y="492" fill="#4f5d75">transaction_id VARCHAR ?</text>
        <text x="756" y="506" fill="#4f5d75">expire_time DATETIME</text>
        <text x="756" y="520" fill="#4f5d75">pay_time DATETIME ?</text>
      </g>

      <!-- ============ 实体：发件箱 ============ -->
      <rect x="472" y="560" width="176" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="560" width="176" height="128" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="482" y="568" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="499" y="577" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
      <text x="524" y="578" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">t_outbox</text>
      <text x="638" y="577" fill="#7a8399" font-size="9" font-family="'Noto Sans SC', sans-serif" text-anchor="end">发件箱表</text>
      <line x1="482" y1="588" x2="638" y2="588" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <g font-family="'Geist Mono', monospace" font-size="9">
        <text x="484" y="604" fill="#2d3142"># id BIGINT</text>
        <text x="484" y="618" fill="#4f5d75">topic VARCHAR</text>
        <text x="484" y="632" fill="#4f5d75">message_key VARCHAR</text>
        <text x="484" y="646" fill="#4f5d75">payload VARCHAR</text>
        <text x="484" y="660" fill="#4f5d75">deliver_time DATETIME</text>
        <text x="484" y="674" fill="#4f5d75">status TINYINT</text>
      </g>

      <!-- ============ 图例（底部横条） ============ -->
      <line x1="48" y1="728" x2="1072" y2="728" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="752" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <g font-family="'Geist Mono', 'Noto Sans SC', monospace" font-size="9" fill="#4f5d75">
        <text x="120" y="752"># 主键</text>
        <text x="200" y="752">→ 外键</text>
        <text x="280" y="752">? 可空</text>
        <text x="360" y="752">线端 1 / N / 0..1 为基数</text>
        <text x="700" y="752">虚线 = 引用内嵌于 payload（无外键列）</text>
      </g>
      <rect x="920" y="744" width="8" height="8" rx="2" fill="rgba(235,108,54,0.30)" stroke="#eb6c36" stroke-width="1"/>
      <text x="936" y="752" fill="#4f5d75" font-size="9" font-family="'Noto Sans SC', sans-serif">核心表</text>
    </svg>
  </div>
</body>
</html>
