spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ticket_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:ticketmysql}
  data:
    redis:
      database: 1
      password: ${REDIS_PASSWORD:ticketredis}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

logging:
  level:
    org.apache.kafka: WARN
    org.redisson: WARN

ticket:
  jwt:
    secret: test-secret-value-for-integration-tests-0123456789
  sms:
    echo-code: true
  topic:
    order-timeout: test.ticket.order.timeout
    payment-sms: test.ticket.payment.sms
  outbox:
    enabled: false
